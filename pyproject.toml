[project]
name = "student-search-api"
version = "0.1.0"
description = "FastAPI for querying student profile information"
readme = "README.md"
requires-python = ">=3.9.2"
dependencies = [
    "bcrypt>=5.0.0",
    "fastapi[standard]>=0.118.0",
    "language-tool-python>=3.2.2",
    "pytz>=2025.2",
    "rapidfuzz>=3.13.0",
    "requests>=2.32.5",
    "scikit-learn>=1.6.1",
    "sumy>=0.12.0",
    "yake>=0.4.8",
]

[tool.basedpyright]
typeCheckingMode = "basic"
